<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Fallback fonts preference order -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>PingFang SC</family>
      <family>Noto Sans</family>
      <family>Open Sans</family>
      <family>Droid Sans</family>
      <family>Roboto</family>
      <family>Tholoth</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>PingFang SC</family>
      <family>Noto Serif</family>
      <family>Droid Serif</family>
      <family>Roboto Slab</family>
      <family>Tholoth</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>MonoLisa</family>
      <family>SF Mono</family>
      <family>Inconsolata</family>
      <family>Droid Sans Mono</family>
      <family>Roboto Mono</family>
    </prefer>
  </alias>

  <!-- Replace common Chinese fonts with Apple's PingFang -->
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans CN</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Serif CJK SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Serif SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>WenQuanYi Micro Hei</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>WenQuanYi Zen Hei</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Droid Sans Fallback</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>AR PL UMing CN</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>AR PL UKai CN</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans CJK TC</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans TC</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans TW</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Serif CJK TC</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Serif TC</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang TC</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans CJK HK</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang HK</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans HK</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang HK</string></edit>
  </match>
</fontconfig>
